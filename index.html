<!DOCTYPE html>
<html lang="en" data-type="software">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="page-type" content="software" />
  <meta name="site-kind" content="software" />
  <title>BoardDeck — HSC Class 12 PYQ &amp; Mock Workspace</title>
  <meta name="description" content="Maharashtra HSC Class 12 board prep workspace across Physics, Chemistry, Mathematics, English, Computer Science (D-9), and Electronics (C-2). Chapter-mapped PYQs, repeat flags, MathJax formulas, timed mocks, and cloud sync." />
  <meta name="theme-color" content="#0a0b0e" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://boardeck.vercel.app/" />
  <meta property="og:title" content="BoardDeck — HSC Class 12 PYQ &amp; Mock Workspace" />
  <meta property="og:description" content="Maharashtra HSC Class 12 chapter-mapped board PYQs across Physics, Chemistry, Maths, English, Computer Science, and Electronics." />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0b0e'/%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='none' stroke='%23d4ff00' stroke-width='2'/%3E%3Crect x='8' y='8' width='7' height='7' rx='1.5' fill='%23f5f7fa'/%3E%3Crect x='17' y='8' width='7' height='7' rx='1.5' fill='%23d4ff00'/%3E%3Crect x='8' y='17' width='7' height='7' rx='1.5' fill='%23d4ff00'/%3E%3Crect x='17' y='17' width='7' height='7' rx='1.5' fill='%23f5f7fa'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script>
    if (!matchMedia('(prefers-reduced-motion:reduce)').matches) {
      document.documentElement.classList.add('m-enter');
    }
    window.MathJax = {
      loader: { load: ['input/tex', 'input/asciimath', '[tex]/mhchem', 'output/chtml'] },
      tex: {
        packages: { '[+]': ['mhchem'] },
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      asciimath: {
        delimiters: [['`', '`']]
      },
      options: {
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process',
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      startup: {
        typeset: false
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/startup.js" async></script>
  <script src="assets/supa-env.js" defer></script>
  <script src="assets/sync.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <div class="shell is-home" id="shell">
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
      <header class="mobile-bar" id="mobileBar">
        <button class="btn sm" onclick="toggleDrawer()" aria-label="Open navigation">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          Menu
        </button>
        <div class="mono" style="font-size:13px;font-weight:600;" id="mobileTitle">BoardDeck</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="btn sm" onclick="openSyncModal()" title="Cloud Sync" aria-label="Cloud Sync">
            <span class="sync-dot" id="mobileSyncDot"></span>
          </button>
          <button class="btn sm" onclick="goHome()" aria-label="All subjects">Subjects</button>
        </div>
      </header>

      <main class="workspace" id="main">
        <div class="skel-header-bar">
          <div class="skel-block skel-pill" style="width:136px;height:20px;"></div>
          <div style="display:flex;gap:8px;">
            <div class="skel-block skel-pill" style="width:74px;height:28px;"></div>
            <div class="skel-block skel-pill" style="width:68px;height:28px;"></div>
          </div>
        </div>
        <div class="hero-screen" style="padding:18px 0 26px;">
          <div class="hero-split">
            <div>
              <div class="skel-block skel-pill" style="width:240px;height:26px;margin-bottom:20px;"></div>
              <div class="skel-block" style="width:88%;height:46px;border-radius:12px;margin-bottom:12px;"></div>
              <div class="skel-block" style="width:72%;height:46px;border-radius:12px;margin-bottom:20px;"></div>
              <div class="skel-block" style="width:82%;height:16px;margin-bottom:8px;"></div>
              <div class="skel-block" style="width:62%;height:16px;margin-bottom:26px;"></div>
              <div style="display:flex;gap:10px;margin-bottom:28px;">
                <div class="skel-block skel-pill" style="width:168px;height:44px;"></div>
                <div class="skel-block skel-pill" style="width:142px;height:44px;"></div>
              </div>
              <div class="hero-proof">
                <div class="skel-block" style="height:36px;"></div>
                <div class="skel-block" style="height:36px;"></div>
                <div class="skel-block" style="height:36px;"></div>
                <div class="skel-block" style="height:36px;"></div>
              </div>
            </div>
            <div class="hero-bento">
              <div class="skel-bento-card" style="grid-column:1 / -1;min-height:242px;">
                <div style="display:flex;justify-content:space-between;gap:8px;">
                  <div class="skel-block skel-pill" style="width:210px;height:30px;"></div>
                  <div class="skel-block skel-pill" style="width:120px;height:24px;"></div>
                </div>
                <div class="skel-block" style="width:86%;height:18px;margin:16px 0;"></div>
                <div class="demo-opts">
                  <div class="skel-block" style="height:38px;border-radius:12px;"></div>
                  <div class="skel-block" style="height:38px;border-radius:12px;"></div>
                  <div class="skel-block" style="height:38px;border-radius:12px;"></div>
                  <div class="skel-block" style="height:38px;border-radius:12px;"></div>
                </div>
              </div>
              <div class="skel-bento-lime">
                <div class="skel-block skel-pill" style="width:110px;height:14px;"></div>
                <div class="skel-block" style="width:72px;height:34px;border-radius:10px;"></div>
                <div class="skel-block skel-pill" style="width:100%;height:36px;"></div>
              </div>
              <div class="skel-bento-card">
                <div class="skel-block skel-pill" style="width:110px;height:14px;"></div>
                <div style="display:flex;align-items:center;gap:14px;">
                  <div class="skel-block" style="width:62px;height:62px;border-radius:50%;flex-shrink:0;"></div>
                  <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
                    <div class="skel-block" style="height:14px;"></div>
                    <div class="skel-block" style="height:14px;"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="skel-dock-bar"></div>
      </main>
    </div>
  </div>

  <!-- Cloud Sync & Account Modal -->
  <div class="modal-backdrop" id="syncModalBackdrop" onclick="if(event.target===this) closeSyncModal()">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="syncModalTitle">
      <div class="modal-head">
        <h3 id="syncModalTitle">Cloud Sync &amp; Backup</h3>
        <button class="btn sm" onclick="closeSyncModal()">Close</button>
      </div>
      <div id="syncModalBody"></div>
    </div>
  </div>

  <!-- Command Palette Search Modal (Ctrl+K) -->
  <div class="modal-backdrop" id="cmdModalBackdrop" onclick="if(event.target===this) closeCmdModal()">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="cmdModalTitle">
      <div class="modal-head">
        <h3 id="cmdModalTitle">Jump to Subject or Chapter</h3>
        <span class="kbd">Esc</span>
      </div>
      <div class="field-group" style="margin-bottom:8px;">
        <input id="cmdInput" type="text" placeholder="Type subject, chapter, or keyword..." oninput="renderCmdResults()" autocomplete="off" />
      </div>
      <div class="cmd-list" id="cmdList"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
