name: Validate Data & Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate question datasets
        run: node scripts/validate-data.mjs
      - name: Syntax check client scripts
        run: |
          node --check assets/app.js
          node --check assets/sync.js
          node --check scripts/inject-env.mjs
